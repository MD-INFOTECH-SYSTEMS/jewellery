<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - Rajwada Royal Jewellery</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'maroon': '#800000',
                        'deep-maroon': '#4a1c1d',
                        'burgundy': '#6b1f24',
                        'royal-pink': '#e5989b',
                        'rose-pink': '#ffb5a7',
                        'gold': '#b58b4c',
                        'champagne': '#f9f6f0',
                        'ivory': '#fffdf9',
                        'dark-brown': '#2c1e16',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Lato"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans antialiased text-gray-800 bg-champagne min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-200">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="flex flex-col items-center leading-none group select-none">
                <svg class="w-7 h-7 text-gold mb-1 group-hover:scale-110 transition-transform duration-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 18h16M5 21h14M4.5 18l-1.5-9 5.5 3.5 3.5-8 3.5 8 5.5-3.5-1.5 9" />
                    <circle cx="12" cy="4.5" r="1.5" fill="currentColor" stroke="none" />
                </svg>
                <span class="text-2xl tracking-[0.2em] font-serif font-bold text-deep-maroon">RAJWADA</span>
            </a>
            <div class="flex items-center gap-6 text-deep-maroon">
                <a href="wishlist.html" class="hover:text-gold transition-colors relative" title="Wishlist">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    <span class="wishlist-count absolute -top-1 -right-2 bg-gold text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
                </a>
                <a href="shopping-bag.html" class="hover:text-gold transition-colors relative" title="Shopping Bag">
                    <svg class="w-6 h-6" fill="currentColor" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span class="cart-count absolute -top-1 -right-2 bg-gold text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
                </a>
                <a href="account.html" class="hover:text-gold transition-colors" title="Account">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow py-12">
        <div class="container mx-auto px-4 max-w-3xl">
            <div id="order-confirm-container" class="bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-gray-100 text-center">
                <!-- Injected via script -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark-brown text-champagne pt-8 pb-8 mt-auto">
        <div class="container mx-auto px-4 text-center text-xs text-gray-400 font-light">
            <p>&copy; 2024 Rajwada Jewellers. All rights reserved. (Frontend Demo Prototype)</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/toast.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(window.toast) window.toast.init();
            if(window.wishlist) window.wishlist.init();
            if(window.cart) window.cart.init();
            renderConfirmation();
        });

        function renderConfirmation() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderIdParam = urlParams.get('id');
            const container = document.getElementById('order-confirm-container');
            if (!container) return;

            let orders = [];
            try {
                orders = JSON.parse(localStorage.getItem('rajwada_orders') || '[]');
            } catch (e) {}

            let order = null;
            if (orderIdParam) {
                order = orders.find(o => o.orderId === orderIdParam);
            }
            if (!order && orders.length > 0) {
                order = orders[0];
            }

            if (!order) {
                container.innerHTML = `
                    <div class="py-12">
                        <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <h2 class="text-2xl font-serif text-[#4a1c1d] font-bold mb-3">No Order Record Found</h2>
                        <p class="text-gray-500 mb-6 text-sm">We couldn't find order details for this reference.</p>
                        <a href="index.html" class="inline-block bg-[#4a1c1d] text-white px-8 py-3 rounded-sm font-bold uppercase tracking-wider text-xs hover:bg-[#b58b4c] transition-colors">Return to Catalog</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>

                <span class="text-xs text-[#b58b4c] font-bold uppercase tracking-widest block mb-1">Order Confirmed</span>
                <h1 class="text-3xl md:text-4xl font-serif text-[#4a1c1d] font-bold mb-2">Thank You, ${order.customer.name}!</h1>
                <p class="text-gray-500 text-sm mb-6">Your order has been recorded in frontend demo mode. An authentic hallmarking receipt will accompany your parcel.</p>

                <div class="bg-[#f9f6f0] p-4 rounded-xl border border-[#b58b4c]/20 max-w-md mx-auto mb-8 flex items-center justify-between text-left">
                    <div>
                        <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Order Number</div>
                        <div class="text-lg font-serif font-bold text-[#4a1c1d]">${order.orderId}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Status</div>
                        <div class="inline-block bg-green-100 text-green-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full">${order.status || 'Order Placed'}</div>
                    </div>
                </div>

                <!-- Items Breakdown -->
                <div class="text-left border-t border-b border-gray-100 py-6 mb-8">
                    <h3 class="font-serif font-bold text-[#4a1c1d] mb-4 text-base">Purchased Jewellery</h3>
                    <div class="space-y-4">
                        ${order.items.map(item => `
                            <div class="flex items-center gap-4">
                                <img src="${item.image}" alt="${item.name}" class="w-14 h-14 object-cover rounded shadow-sm">
                                <div class="flex-1 min-w-0">
                                    <div class="text-sm font-bold text-[#4a1c1d] truncate">${item.name}</div>
                                    <div class="text-xs text-gray-400">Qty: ${item.quantity} × ₹${item.price.toLocaleString()}</div>
                                </div>
                                <div class="text-sm font-bold text-[#4a1c1d]">₹${(item.price * item.quantity).toLocaleString()}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="mt-6 pt-4 border-t border-gray-100 flex justify-between items-center text-base font-bold text-[#4a1c1d]">
                        <span>Total Paid</span>
                        <span class="text-xl">₹${order.totalAmount.toLocaleString()}</span>
                    </div>
                </div>

                <!-- Delivery & Payment Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left text-xs text-gray-600 mb-8 bg-gray-50 p-6 rounded-xl border border-gray-100">
                    <div>
                        <h4 class="font-bold text-gray-800 uppercase tracking-wider mb-2">Delivery Address</h4>
                        <p class="font-medium text-gray-900">${order.customer.name}</p>
                        <p>${order.shippingAddress.address}</p>
                        <p>${order.shippingAddress.city}, ${order.shippingAddress.state} - ${order.shippingAddress.pincode}</p>
                        <p class="mt-1">📞 ${order.customer.phone}</p>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-800 uppercase tracking-wider mb-2">Payment Details</h4>
                        <p><span class="font-semibold text-gray-800">Method:</span> ${order.paymentMethod === 'COD' ? 'Cash on Delivery (Insured Express)' : order.paymentMethod}</p>
                        <p class="mt-1"><span class="font-semibold text-gray-800">Insurance:</span> Complimentary Transit Coverage</p>
                        <p class="mt-1"><span class="font-semibold text-gray-800">Expected Delivery:</span> 3 - 5 Business Days</p>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="account.html" class="bg-[#4a1c1d] text-white px-8 py-3.5 rounded hover:bg-[#b58b4c] transition-colors font-bold uppercase tracking-wider text-xs shadow-md">
                        View Order History
                    </a>
                    <a href="index.html" class="border border-gray-300 text-gray-700 px-8 py-3.5 rounded hover:border-[#4a1c1d] transition-colors font-bold uppercase tracking-wider text-xs">
                        Continue Shopping
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>
